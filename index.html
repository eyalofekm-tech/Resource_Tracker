<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#1c1c1e;--bg2:#2c2c2e;--bg3:#3a3a3c;--bg4:#48484a;
  --text:#f5f5f7;--text2:#aeaeb2;--text3:#636366;
  --accent:#f4a018;--accent2:#c07d10;
  --danger:#e03c3c;--success:#30d158;
  --border:rgba(255,255,255,0.08);
  --radius:14px;--radius-sm:8px;
  --font:-apple-system,'SF Pro Display',BlinkMacSystemFont,sans-serif;
}
body{background:var(--bg);color:var(--text);font-family:var(--font);min-height:600px;overflow-x:hidden}
.screen{display:none;flex-direction:column;min-height:600px}
.screen.active{display:flex}

/* HOME */
.home-header{padding:28px 20px 8px;display:flex;align-items:flex-end;justify-content:space-between}
.home-header h1{font-size:30px;font-weight:700;letter-spacing:-.5px}
.home-content{padding:0 16px 100px;flex:1}
.block-card{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);margin-bottom:12px;overflow:hidden;cursor:pointer;transition:background .15s}
.block-card:active{background:var(--bg3)}
.block-card-inner{display:flex;align-items:center;padding:16px}
.block-card-icon{width:38px;height:38px;border-radius:10px;background:rgba(244,160,24,0.18);display:flex;align-items:center;justify-content:center;font-size:18px;margin-right:14px;flex-shrink:0}
.block-card-info{flex:1;min-width:0}
.block-card-info h2{font-size:16px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block-card-meta{font-size:12px;color:var(--text3);margin-top:2px}
.block-card-actions{display:flex;gap:6px;margin-left:10px}
.ic-btn{background:var(--bg3);border:none;border-radius:7px;color:var(--text2);width:32px;height:32px;cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;transition:background .12s,color .12s;flex-shrink:0}
.ic-btn:hover{background:var(--bg4);color:var(--text)}
.ic-btn.del:hover{background:rgba(224,60,60,0.18);color:var(--danger)}
.fab{position:fixed;bottom:28px;right:24px;background:var(--accent);color:#fff;border:none;border-radius:50%;width:56px;height:56px;font-size:28px;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 20px rgba(244,160,24,0.35);transition:transform .15s,background .15s;z-index:50}
.fab:hover{background:var(--accent2);transform:scale(1.06)}
.empty-state{text-align:center;padding:60px 20px;color:var(--text3)}
.empty-state .emo{font-size:44px;margin-bottom:12px}
.empty-state p{font-size:15px;line-height:1.5}

/* DETAIL */
.detail-header{padding:0;background:var(--bg2);border-bottom:1px solid var(--border);flex-shrink:0}
.detail-topbar{display:flex;align-items:center;gap:10px;padding:14px 16px}
.back-btn{background:none;border:none;color:var(--accent);font-size:15px;cursor:pointer;font-family:var(--font);display:flex;align-items:center;gap:4px;padding:4px 0;white-space:nowrap}
.detail-title-row{padding:4px 16px 14px;display:flex;align-items:center;gap:8px}
.detail-title{font-size:26px;font-weight:700;letter-spacing:-.4px;flex:1;min-width:0;word-break:break-word}
.detail-content{flex:1;overflow-y:auto;padding:16px 16px 120px}

/* ITEMS */
.item-block{background:var(--bg2);border-radius:var(--radius);margin-bottom:14px;overflow:hidden;border:1px solid var(--border)}
.item-header-row{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid var(--border)}
.item-title{font-size:16px;font-weight:600;flex:1}
.res-row{display:flex;align-items:center;gap:8px;padding:9px 14px;border-bottom:1px solid var(--border)}
.res-row:last-of-type{border-bottom:none}
.res-cb{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.res-name{flex:1;font-size:14px;color:var(--text)}
.res-name.done{color:var(--text3);text-decoration:line-through}
.num-ctrl{display:flex;align-items:center;gap:4px;flex-shrink:0}
.nb{background:var(--bg3);border:none;color:var(--text);border-radius:6px;width:28px;height:28px;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;transition:background .1s}
.nb:hover{background:var(--bg4)}
.ni{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:6px;width:54px;height:28px;text-align:center;font-size:13px;font-family:var(--font)}
.ni:focus{outline:none;border-color:var(--accent)}
.res-del{background:none;border:none;color:var(--text3);cursor:pointer;font-size:15px;padding:2px 4px;border-radius:4px;transition:color .1s;flex-shrink:0}
.res-del:hover{color:var(--danger)}
.add-res-row{display:flex;align-items:center;gap:6px;padding:10px 14px}
.ai{background:var(--bg);border:1px solid var(--border);color:var(--text);border-radius:7px;padding:7px 10px;font-size:13px;font-family:var(--font)}
.ai:focus{outline:none;border-color:var(--accent)}
.ai.grow{flex:1}
.ai.narrow{width:62px}
.add-ab{background:var(--accent);border:none;color:#fff;border-radius:7px;padding:7px 12px;font-size:13px;cursor:pointer;font-family:var(--font);font-weight:500;white-space:nowrap;transition:background .12s;flex-shrink:0}
.add-ab:hover{background:var(--accent2)}
.add-item-bar{display:flex;gap:8px;margin-bottom:14px}
.add-item-bar input{flex:1;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:10px;padding:11px 14px;font-size:14px;font-family:var(--font)}
.add-item-bar input:focus{outline:none;border-color:var(--accent)}

/* TOTALS */
.totals-card{background:rgba(244,160,24,0.07);border:1px solid rgba(244,160,24,0.22);border-radius:var(--radius);padding:14px;margin-top:4px}
.totals-label{font-size:11px;font-weight:700;color:var(--accent);letter-spacing:.8px;text-transform:uppercase;margin-bottom:10px}
.total-row{display:flex;align-items:center;gap:8px;padding:6px 0;border-bottom:1px solid rgba(244,160,24,0.1)}
.total-row:last-child{border-bottom:none}
.total-cb{width:20px;height:20px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.total-name{flex:1;font-size:14px}
.total-name.done{color:var(--text3);text-decoration:line-through}
.total-amt{font-size:15px;font-weight:600;color:var(--accent);min-width:36px;text-align:right}
.total-amt.zero{color:var(--success)}

/* MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.65);display:flex;align-items:center;justify-content:center;z-index:200;padding:20px}
.modal{background:var(--bg2);border-radius:var(--radius);border:1px solid var(--border);padding:22px;width:100%;max-width:360px}
.modal h3{font-size:17px;margin-bottom:14px;font-weight:600}
.modal input{background:var(--bg3);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:11px 13px;font-size:15px;font-family:var(--font);width:100%;margin-bottom:14px}
.modal input:focus{outline:none;border-color:var(--accent)}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.modal-btns button{border:none;border-radius:8px;padding:9px 20px;font-size:14px;cursor:pointer;font-family:var(--font);font-weight:500}
.btn-cancel{background:var(--bg3);color:var(--text2)}
.btn-cancel:hover{background:var(--bg4)}
.btn-ok{background:var(--accent);color:#fff}
.btn-ok:hover{background:var(--accent2)}
</style>

<!-- HOME SCREEN -->
<div id="screen-home" class="screen active">
  <div class="home-header">
    <h1>List of Blocks</h1>
  </div>
  <div class="home-content" id="home-content"></div>
  <button class="fab" id="fab">+</button>
</div>

<!-- DETAIL SCREEN -->
<div id="screen-detail" class="screen">
  <div class="detail-header">
    <div class="detail-topbar">
      <button class="back-btn" id="back-btn">&#8592; Lists</button>
    </div>
    <div class="detail-title-row">
      <div class="detail-title" id="detail-title"></div>
      <button class="ic-btn" id="rename-block-btn" title="Rename block">✎</button>
    </div>
  </div>
  <div class="detail-content" id="detail-content"></div>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modal-overlay" style="display:none">
  <div class="modal">
    <h3 id="modal-title">New Block</h3>
    <input type="text" id="modal-input" autocomplete="off" placeholder="Name..." />
    <div class="modal-btns">
      <button class="btn-cancel" id="modal-cancel">Cancel</button>
      <button class="btn-ok" id="modal-ok">OK</button>
    </div>
  </div>
</div>

<script>
let state = {blocks:[]};
let nextId = 1;
let currentBlockId = null;
const uid = () => nextId++;

function save(){try{localStorage.setItem('cplanner2',JSON.stringify({state,nextId}))}catch(e){}}
function load(){try{const d=JSON.parse(localStorage.getItem('cplanner2'));if(d&&d.state){state=d.state;nextId=d.nextId||100}}catch(e){}}

function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('screen-'+id).classList.add('active');
}

function openBlock(bid){
  currentBlockId = bid;
  const block = state.blocks.find(b=>b.id===bid);
  if(!block) return;
  document.getElementById('detail-title').textContent = block.name;
  renderDetail();
  showScreen('detail');
}

// ---- HOME ----
function renderHome(){
  save();
  const c = document.getElementById('home-content');
  if(!state.blocks.length){
    c.innerHTML=`<div class="empty-state"><div class="emo">Blocks</div><p>No blocks yet.<br>Tap + to create your first block.</p></div>`;
    return;
  }
  c.innerHTML = state.blocks.map(block=>{
    const itemCount = block.items.length;
    const resCount = block.items.reduce((a,i)=>a+i.resources.length,0);
    const done = block.items.reduce((a,i)=>a+i.resources.filter(r=>r.checked).length,0);
    return `<div class="block-card" data-bid="${block.id}">
      <div class="block-card-inner">
        <div class="block-card-icon">📋</div>
        <div class="block-card-info">
          <h2>${esc(block.name)}</h2>
          <div class="block-card-meta">${itemCount} item${itemCount!==1?'s':''} · ${done}/${resCount} resources gathered</div>
        </div>
        <div class="block-card-actions">
          <button class="ic-btn" data-action="rename" data-bid="${block.id}" title="Rename">✎</button>
          <button class="ic-btn del" data-action="delete" data-bid="${block.id}" title="Delete">✕</button>
        </div>
      </div>
    </div>`;
  }).join('');
  c.querySelectorAll('.block-card').forEach(el=>{
    el.addEventListener('click', e=>{
      if(e.target.closest('.block-card-actions')) return;
      openBlock(+el.dataset.bid);
    });
  });
  c.querySelectorAll('[data-action]').forEach(btn=>{
    btn.addEventListener('click', e=>{
      e.stopPropagation();
      const bid = +btn.dataset.bid;
      const block = state.blocks.find(b=>b.id===bid);
      if(btn.dataset.action==='delete'){
        if(confirm(`Delete "${block.name}"?`)){state.blocks=state.blocks.filter(b=>b.id!==bid);renderHome();}
      } else if(btn.dataset.action==='rename'){
        showModal('Rename Block', block.name, val=>{block.name=val;renderHome();});
      }
    });
  });
}

// ---- DETAIL ----
function getBlock(){return state.blocks.find(b=>b.id===currentBlockId)}

function computeTotals(block){
  const map={};
  for(const item of block.items){
    for(const res of item.resources){
      if(!map[res.name]) map[res.name]={name:res.name,needed:0,checkedAmt:0};
      const amt=Number(res.amount)||0;
      map[res.name].needed+=amt;
      if(res.checked) map[res.name].checkedAmt+=amt;
    }
  }
  return Object.values(map).map(t=>({...t,remaining:t.needed-t.checkedAmt,allChecked:t.needed>0&&t.checkedAmt>=t.needed}));
}

function renderDetail(){
  save();
  const block = getBlock();
  if(!block) return;
  document.getElementById('detail-title').textContent = block.name;
  const c = document.getElementById('detail-content');

  let html = `<div class="add-item-bar"><input type="text" id="new-item-input" placeholder="Add new item..." autocomplete="off"/><button class="add-ab" id="new-item-btn">+ Item</button></div>`;

  for(const item of block.items){
    html += `<div class="item-block" data-iid="${item.id}">
      <div class="item-header-row">
        <span class="item-title">${esc(item.name)}</span>
        <div style="display:flex;gap:6px">
          <button class="ic-btn" data-action="rename-item" data-iid="${item.id}" title="Rename">✎</button>
          <button class="ic-btn del" data-action="delete-item" data-iid="${item.id}" title="Delete">✕</button>
        </div>
      </div>`;
    for(const res of item.resources){
      html += `<div class="res-row" data-rid="${res.id}" data-iid="${item.id}">
        <input type="checkbox" class="res-cb" data-action="toggle-res" ${res.checked?'checked':''} />
        <span class="res-name ${res.checked?'done':''}">${esc(res.name)}</span>
        <div class="num-ctrl">
          <button class="nb" data-action="dec-res">−</button>
          <input type="number" class="ni" data-action="set-res-amt" value="${res.amount}" min="0" />
          <button class="nb" data-action="inc-res">+</button>
        </div>
        <button class="res-del" data-action="delete-res" title="Remove">✕</button>
      </div>`;
    }
    html += `<div class="add-res-row">
      <input class="ai grow" type="text" data-action="res-name-input" placeholder="Resource name..." autocomplete="off"/>
      <input class="ai narrow" type="number" data-action="res-qty-input" placeholder="Qty" min="0"/>
      <button class="add-ab" data-action="add-res">+ Add</button>
    </div></div>`;
  }

  const totals = computeTotals(block);
  if(totals.length){
    html += `<div class="totals-card"><div class="totals-label">Total</div>`;
    for(const t of totals){
      html += `<div class="total-row" data-rname="${esc(t.name)}">
        <input type="checkbox" class="total-cb" ${t.allChecked?'checked':''} />
        <span class="total-name ${t.allChecked?'done':''}">${esc(t.name)}</span>
        <span class="total-amt ${t.remaining<=0?'zero':''}">${t.remaining>0?t.remaining:'✓'}</span>
      </div>`;
    }
    html += `</div>`;
  }

  c.innerHTML = html;

  // Add item
  const newItemInput = c.querySelector('#new-item-input');
  c.querySelector('#new-item-btn').addEventListener('click',()=>doAddItem(newItemInput));
  newItemInput.addEventListener('keydown',e=>{if(e.key==='Enter')doAddItem(newItemInput)});

  // Item header actions
  c.querySelectorAll('[data-action="rename-item"]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const iid=+btn.dataset.iid;
      const item=block.items.find(i=>i.id===iid);
      showModal('Rename Item',item.name,val=>{item.name=val;renderDetail()});
    });
  });
  c.querySelectorAll('[data-action="delete-item"]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const iid=+btn.dataset.iid;
      const item=block.items.find(i=>i.id===iid);
      if(confirm(`Delete item "${item.name}"?`)){block.items=block.items.filter(i=>i.id!==iid);renderDetail();}
    });
  });

  // Resource add
  c.querySelectorAll('[data-action="add-res"]').forEach(btn=>{
    btn.addEventListener('click',()=>{
      const row=btn.closest('.item-block');
      const iid=+row.dataset.iid;
      const item=block.items.find(i=>i.id===iid);
      const nameIn=row.querySelector('[data-action="res-name-input"]');
      const qtyIn=row.querySelector('[data-action="res-qty-input"]');
      const name=nameIn.value.trim();
      if(!name) return;
      item.resources.push({id:uid(),name,amount:Math.max(0,parseInt(qtyIn.value)||1),checked:false});
      renderDetail();
    });
  });
  c.querySelectorAll('[data-action="res-name-input"]').forEach(inp=>{
    inp.addEventListener('keydown',e=>{
      if(e.key==='Enter') inp.closest('.item-block').querySelector('[data-action="add-res"]').click();
    });
  });

  // Resource actions
  c.querySelectorAll('.res-row').forEach(row=>{
    const iid=+row.dataset.iid, rid=+row.dataset.rid;
    const item=block.items.find(i=>i.id===iid);
    const res=item?.resources.find(r=>r.id===rid);
    if(!res) return;
    row.querySelector('[data-action="toggle-res"]').addEventListener('change',e=>{
      res.checked=e.target.checked;renderDetail();
    });
    row.querySelector('[data-action="set-res-amt"]').addEventListener('change',e=>{
      res.amount=Math.max(0,parseInt(e.target.value)||0);renderDetail();
    });
    row.querySelector('[data-action="inc-res"]').addEventListener('click',()=>{res.amount=(Number(res.amount)||0)+1;renderDetail()});
    row.querySelector('[data-action="dec-res"]').addEventListener('click',()=>{res.amount=Math.max(0,(Number(res.amount)||0)-1);renderDetail()});
    row.querySelector('[data-action="delete-res"]').addEventListener('click',()=>{
      item.resources=item.resources.filter(r=>r.id!==res.id);renderDetail();
    });
  });

  // Total checkboxes
  c.querySelectorAll('.total-row').forEach(row=>{
    const rname = row.dataset.rname;
    row.querySelector('.total-cb').addEventListener('change',e=>{
      const checked=e.target.checked;
      for(const item of block.items)
        for(const res of item.resources)
          if(res.name===rname) res.checked=checked;
      renderDetail();
    });
  });
}

function doAddItem(input){
  const block=getBlock();
  const name=input.value.trim();
  if(!name) return;
  block.items.push({id:uid(),name,resources:[]});
  input.value='';
  renderDetail();
}

// Back button
document.getElementById('back-btn').addEventListener('click',()=>{
  currentBlockId=null;
  renderHome();
  showScreen('home');
});

// Rename block from detail
document.getElementById('rename-block-btn').addEventListener('click',()=>{
  const block=getBlock();
  showModal('Rename Block',block.name,val=>{block.name=val;renderDetail();renderHome();});
});

// FAB
document.getElementById('fab').addEventListener('click',()=>{
  showModal('New Block','',val=>{
    state.blocks.push({id:uid(),name:val,items:[]});
    renderHome();
  });
});

// MODAL
let modalCb=null;
function showModal(title,current,cb){
  document.getElementById('modal-title').textContent=title;
  const inp=document.getElementById('modal-input');
  inp.value=current||'';
  modalCb=cb;
  document.getElementById('modal-overlay').style.display='flex';
  setTimeout(()=>inp.select(),30);
}
function hideModal(){document.getElementById('modal-overlay').style.display='none';modalCb=null;}
document.getElementById('modal-ok').addEventListener('click',()=>{
  const val=document.getElementById('modal-input').value.trim();
  if(val&&modalCb)modalCb(val);
  hideModal();
});
document.getElementById('modal-cancel').addEventListener('click',hideModal);
document.getElementById('modal-input').addEventListener('keydown',e=>{
  if(e.key==='Enter')document.getElementById('modal-ok').click();
  if(e.key==='Escape')hideModal();
});

load();
renderHome();
</script>
